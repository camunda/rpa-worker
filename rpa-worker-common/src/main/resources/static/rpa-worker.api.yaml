openapi: 3.1.0
info:
  title: RPA Worker
  version: 1.0.0
  description: >-
    Evaluation executes caller-supplied code with worker privileges and environment;
    it is not OS-isolated. Privileged APIs require a worker bearer token configured
    with camunda.rpa.api.token. Execution callbacks require a separate per-execution
    RPA_CALLBACK_TOKEN, revoked when execution ends. Cluster client credentials do
    not authenticate this API. Read-only Actuator health requests, including
    liveness and readiness subpaths, require neither a token nor a trusted Host.
    All other requests are subject to trusted Host validation. Actuator metrics
    and Prometheus scraping require the worker bearer token as well.
security:
  - WorkerApiToken: []
  
tags:
  - name: Sandbox
    description: >-
      Direct evaluation of Robot scripts.
      Used by the Modeler for local script development and testing
  - name: File Management
    description: >-
      Upload and download files to/from Zeebe.
      Used by the Camunda Robot Python Library to fulfil document management keywords
  - name: Zeebe & Job Control
  - name: Workspace

paths:
  /api/authentication:
    get:
      summary: Verify worker API credentials without executing a script
      responses:
        204:
          description: The worker API token was accepted
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'

  /script/evaluate:
    post: 
      tags:
        - Sandbox
      summary: Immediately evaluate a raw Robot script
      description: >-
        Runs trusted code with the worker's OS privileges and inherited environment.
        Enabled by default for desktop builds, but requires a configured worker API
        token. Disabled by default in container images.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRawScriptRequest'
          'application/vnd.camunda.rpa+json':
            schema:
              $ref: '#/components/schemas/EvaluateRichScriptRequest'
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'
        404:
          description: Evaluation is disabled
        200:
          description: Script was executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateScriptResponse'
        422:
          description: Request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'
        500:
          description: >-
            A server-side error occurred while executing the Robot script.
            This signifies a low-level process execution failure, in other words the Worker failed to either configure 
            or execute the Robot process to run the script. It does not mean that Robot reported an error, in which 
            case the response would be 200, with `result` set to `ERROR`. 
                
  /file/store/{workspaceId}:
    post: 
      security:
        - ExecutionToken: []
      tags:
        - File Management
      summary: Store files from a Robot workspace in Zeebe
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: 
            type: string
          description: |
            The workspace ID for the current robot job.
            This is made available to the job as the `RPA_WORKSPACE_ID` environment variable.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreFilesRequest'
            example: 
              files: 'outputs/**/*.pdf'
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'
        200:
          description: Files were successfully uploaded to Zeebe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreFilesResponse'
              example: 
                'output/2024-07/invoice-july-2024.pdf': 
                  'camunda.document.type': 'camunda'
                  storeId: 'gcp'
                  documentId: 'zeebe-document-id-1'
                  metadata:
                    fileName: 'output/2024-07/invoice-july-2024.pdf'
                    customProperties: {}
                'output/2024-08/invoice-aug-2024.pdf':
                  'camunda.document.type': 'camunda'
                  storeId: 'gcp'
                  documentId: 'zeebe-document-id-2'
                  metadata:
                    fileName: 'output/2024-08/invoice-aug-2024.pdf'
                    customProperties: { }
        404:
          description: The Job Key, or its associated workspace, was not found
        422:
          description: Request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'
                
  /file/retrieve/{workspaceId}:
    post:
      security:
        - ExecutionToken: []
      tags:
        - File Management
      summary: Retrieve files from Zeebe and make them available in the Robot workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
          description: |
            The workspace ID for the current robot job.
            This is made available to the job as the `RPA_WORKSPACE_ID` environment variable.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/RetrieveFileRequest'
            example: 
              'input/data.csv':
                'camunda.document.type': 'camunda'
                storeId: 'gcp'
                documentId: 'zeebe-document-id-1'
              'input/optional-data.csv':
                'camunda.document.type': 'camunda'
                storeId: 'gcp'
                documentId: 'zeebe-document-id-2'
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'
        200:
          description: The request was processed successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: 
                  $ref: '#/components/schemas/RetrieveFileResponse'
              example: 
                'input/data.csv':
                  result: OK
                'input/optional-data.csv':
                  result: NOT_FOUND
        404:
          description: The Job Key, or its associated workspace, was not found
        422:
          description: Request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'
                
  /zeebe/job/{jobKey}/throw:
    post:
      security:
        - ExecutionToken: []
      tags:
        - Zeebe & Job Control
      summary: >- 
        Issue a `Throw Error` command to Zeebe for the given Job. The Worker will detach itself from the execution, do 
        no further processing, and not report any results to Zeebe when the process finishes.
        The execution token must belong to a running workspace associated with this
        job. A job key or worker API token alone is insufficient. Remains available
        when sandbox evaluation is disabled. Sandbox executions can use -1 only
        for stubbed calls regardless of whether the Camunda client is enabled,
        never for a real command.
      parameters:
        - in: path
          name: jobKey
          required: true
          schema:
            type: integer
            format: int64
          description: The Job key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/JobThrowErrorRequest'
            example:
              'errorCode': "THE_ERROR_CODE"
              'errorMessage': "The error message"
              'variables':
                var1: "value1"
                var2: "value2"
      responses:
        400:
          description: A nonpositive job key other than the sandbox marker -1 was supplied
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'
        202:
          description: The request was processed successfully, and the command will be sent to Zeebe
        501:
          description: A sandbox call using job key -1 returned a stubbed response; no cluster command was sent
        422:
          description: Request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'
                
  /workspace/{workspaceId}/{path}:
    get:
      security: []
      tags: [Workspace]
      summary: Proxy a file from a Workspace
      description: >-
        Read-only capability URL, retained for embedded reports. Keep the
        unguessable workspace URL private. Host validation still applies.
      parameters:
        - in: path
          name: workspaceId
          description: The Workspace ID
          required: true
          schema:
            type: string
        - in: path
          name: path
          description: The file path, relative to the Workspace root
          required: true
          schema:
            type: string
        - in: query
          name: attachment
          description: Whether to set file attachment headers on response (flag)
          schema: false
          
  /workspace/{workspaceId}/variables:
    post:
      security:
        - ExecutionToken: []
      tags: [ Workspace ]
      summary: Attach variables to the calling execution's workspace
      parameters:
        - in: path
          name: workspaceId
          description: The Workspace ID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/AttachVariablesRequest'
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/UntrustedHost'
        200:
          description: The variables were added to the current Workspace
        404:
          description: A Workspace with the provided ID was not found
        422:
          description: Request body was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'

components:
  securitySchemes:
    WorkerApiToken:
      type: http
      scheme: bearer
      description: The configured camunda.rpa.api.token; never a cluster client credential.
    ExecutionToken:
      type: http
      scheme: bearer
      description: >-
        The RPA_CALLBACK_TOKEN supplied to the execution. Valid only for its
        workspace and associated job, and revoked when execution ends.
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or incorrectly scoped bearer credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
    UntrustedHost:
      description: The Host authority is not trusted by the worker.
  schemas:
    DeployScriptRequest:
      type: object
      properties: 
        id:
          type: string
          description: The unique identifier of the script
          required: true
        script:
          type: string
          description: The body of the raw Robot script to be executed
          required: true
    
    ValidationFailedResponse:
      type: object
      properties: 
        fieldErrors:
          type: object
          additionalProperties: 
            $ref: '#/components/schemas/FieldError'
            
    FieldError:
      type: object
      properties: 
        code: 
          type: string
        message: 
          type: string
        rejectedValue: 
          type: any
      
    EvaluateRawScriptRequest:
      type: object
      properties: 
        script:
          type: string
          description: The contents of the raw Robot script to be executed
        variables:
          type: object
          description: Input variables for the execution
          additionalProperties: {}
        workspaceAffinityKey:
          type: string
          description: |
            An arbitrary string used to group executions together so as to influence the preserve-last behaviour for
            Workspace cleanup
            
            
    EvaluateRichScriptRequest:
      type: object
      properties:
        rpa:
          description: The RPA Resource to be executed
          $ref: '#/components/schemas/RpaResource'
        variables:
          type: object
          description: Input variables for the execution
          additionalProperties: { }
        workspaceAffinityKey:
          type: string
          description: |
            An arbitrary string used to group executions together so as to influence the preserve-last behaviour for
            Workspace cleanup
    
    RpaResource:
      type: object
      properties: 
        id:
          type: string
        name:
          type: string
        executionPlatform:
          type: string
        executionPlatformVersion:
          type: string
        script:
          type: string
          description: The contents of the main Robot script file
        files:
          type: object
          description: Map of path to base64-encoded, gzipped, additional files
          additionalProperties: {}
    
    EvaluateScriptResponse:
      type: object
      properties:
        result:
          type: string
          enum: [PASS, FAIL, ERROR]
          description: >- 
            The result of the Robot execution. `PASS` signifies that the Robot execution was successful, 
            and there were no task failures or errors. `FAIL` signifies that there were task failures, and `ERROR`
            signifies that although the *process* execution was successful, the *Robot* execution was not (ie Robot
            reported errors).
        log:
          type: string
          description: The raw output from the script execution
        outputXml:
          type: string
          description: The xUnit XML report the execution
        variables:
          type: object
          additionalProperties: {}
          description: The output variables returned by the execution
        workspace:
          type: object
          description: A map of files in the workspace to URLs providing proxies to their contents
          additionalProperties: 
            type: string
    
    StoreFilesRequest: 
      type: object
      properties: 
        files:
          type: string
          required: true
          description: A glob pattern (relative to the Robot execution workspace) of files to store
          
    StoreFilesResponse: 
      type: object
      description: A map of stored workspace file to ZeebeDocumentDescriptor
      additionalProperties: 
        type: object
        $ref: '#/components/schemas/ZeebeDocumentDescriptor'
        
    RetrieveFileRequest: 
      type: object
      description: A map of workspace destination path to ZeebeDocumentDescriptor
      additionalProperties: 
        $ref: '#/components/schemas/ZeebeDocumentDescriptor'
    
    RetrieveFileResponse:
      type: object
      properties:
        result:
          type: string
          enum:
            - OK
            - NOT_FOUND
            - ERROR
            - BAD_REQUEST
        details:
          type: string
          description: Will always be null except for when result is `ERROR`, in which case it will be a description of the error
    
    ZeebeDocumentDescriptor: 
      type: object
      properties:
        'camunda.document.type':
          type: string
          enum: ['camunda']
        storeId:
          type: string
        documentId:
          type: string
        metadata:
          type: object
          properties: 
            fileName:
              type: string
            customProperties:
              type: object
              additionalProperties: {}
              
    JobThrowErrorRequest:
      type: object
      properties:
        errorCode:
          type: string
          required: true
          description: The error code for the error
        errorMessage:
          type: string
          required: false
          description: >- 
            Provide an error message describing the reason for the non-technical error. 
            If the error is not caught by an error catch event, this message will be a part of the raised incident
        variables:
          type: object
          required: false
          additionalProperties: { }
          description: Set the variables for the command
          
    AttachVariablesRequest:
      type: object
      properties:
        variables: 
          type: object
          required: true
          additionalProperties: { }
          description: The variables to attach to the Workspace
        
